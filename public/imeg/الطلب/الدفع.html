          },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        input[type="text"], input[type="email"], input[type="tel"], select {
            border: none;
            border-bottom: 1px solid #1c1b1b;
            background-color: transparent;
            padding: 12px 0;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, select:focus {
            border-bottom-color: #745c00;
            box-shadow: none;
        }
        
        .radio-custom {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 20px;
            height: 20px;
            border: 1px solid #717973;
            border-radius: 50%;
            display: grid;
            place-content: center;
        }
        .radio-custom::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #002215;
        }
        .radio-custom:checked::before {
            transform: scale(1);
        }
        .radio-custom:focus {
            outline: max(2px, 0.15em) solid currentColor;
            outline-offset: max(2px, 0.15em);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased selection:bg-secondary selection:text-on-secondary">
<!-- Checkout Content Canvas -->
<main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-section-gap grid grid-cols-1 md:grid-cols-12 gap-gutter md:gap-x-16">
<!-- Left Column: Order Summary (Sticky) -->
<aside class="md:col-span-4 order-2 md:order-1 relative">
<div class="sticky top-20 bg-surface-container-lowest p-8 shadow-[0_4px_40px_rgba(0,34,21,0.04)] border border-outline-variant/30">
<h2 class="font-headline-sm text-headline-sm text-primary mb-8 pb-4 border-b border-outline-variant">ملخص الطلب</h2>
<div class="space-y-6 mb-8">
<!-- Product 1 -->
<div class="flex gap-4">
<div class="w-20 h-24 bg-surface-variant flex-shrink-0 relative overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A luxurious, minimalist photograph of an elegant emerald green perfume bottle labeled 'L'Essence Émeraude' sitting on a pristine white marble slab. The lighting is soft and high-key, creating subtle reflections and a sophisticated, airy atmosphere typical of high-end beauty editorials." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC76zqDtEYLXMYkqwGH8qLt0CPqEgI6GMqikhaQNqx0THdub1qLvxTp6DRHABIHqSBE27oIHmzszhnDUbvetN7PcOnKtgXekh1IqH-ir1JZNFutp4Z1y7x5X7J6frkMqhtR5jThxb-MuZCrtTlgfP74R149EWy6nqq9i5hNIbHpiPn-dqErjUdmngJfZb87w5tDyBGj8_Br3SqXub7d7Qpr92oUz78ujfKHK64N-g99oyB89Ei-7f2IfQ"/>
</div>
<div class="flex-grow flex flex-col justify-center">
<h3 class="font-headline-sm text-[18px] leading-snug text-primary">L'Essence Émeraude</h3>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">الكمية: ١</p>
<p class="font-body-md text-body-md text-on-secondary-container mt-2">١,٢٥٠ ريال</p>
</div>
</div>
<!-- Product 2 -->
<div class="flex gap-4">
<div class="w-20 h-24 bg-surface-variant flex-shrink-0 relative overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A high-end, minimalist photograph of a dark, mysterious perfume bottle named 'Oud Nuit' resting on a smooth dark slate surface. The scene is illuminated by soft, moody lighting that highlights the elegant silhouette of the bottle, conveying a sense of timeless exclusivity and luxury." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDjGbkjd2ZbhE-mb4kbgOm0Vi1JUbP5sOCPaHmmDZPWyTguJ0PP-cm47W972tKM1Q1O0Qs_2p-rpFlqyewsvsgiJ8ZhWcmhxoWSUnCLIxKBJv8MMtPqjeBwkQI2a41SqvwOEtOwsMHGT5j0caJqoJDLmVKpJRmM6fPfyIUiI9IYniiedxyUJWqNum5utsIuqH6-femQbEM6ELrebLG8G-7sPF8gioJkgzUQxFdATeY6MO3xd5eky_m1A"/>
</div>
<div class="flex-grow flex flex-col justify-center">
<h3 class="font-headline-sm text-[18px] leading-snug text-primary">Oud Nuit</h3>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">الكمية: ١</p>
<p class="font-body-md text-body-md text-on-secondary-container mt-2">٩٨٠ ريال</p>
</div>
</div>
</div>
<div class="border-t border-outline-variant pt-6 space-y-4">
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>المجموع الفرعي</span>
<span>٢,٢٣٠ ريال</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>رسوم التوصيل</span>
<span>٥٠ ريال</span>
</div>
<div class="flex justify-between font-headline-sm text-[20px] text-primary pt-4 border-t border-outline-variant mt-4">
<span>المجموع الإجمالي</span>
<span>٢,٢٨٠ ريال</span>
</div>
</div>
</div>
</aside>
<!-- Right Column: Shipping & Payment Form -->
<div class="md:col-span-8 order-1 md:order-2">
<div class="mb-12">
<a class="inline-flex items-center text-on-surface-variant hover:text-primary transition-colors font-label-caps text-label-caps gap-2" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                    العودة إلى السلة
                </a>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter mb-12">الدفع</h1>
<form action="#" method="POST">
<!-- Shipping Details Section -->
<section class="mb-section-gap">
<h2 class="font-headline-md text-headline-md text-primary mb-8">تفاصيل الشحن</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-10">
<!-- Name -->
<div class="flex flex-col relative group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-on-secondary-container transition-colors" for="fullName">الاسم الكامل</label>
<input class="w-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-secondary-container" id="fullName" name="fullName" placeholder="أدخل اسمك الكامل" required="" type="text"/>
</div>
<!-- Phone -->
<div class="flex flex-col relative group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-on-secondary-container transition-colors" for="phone">رقم الهاتف</label>
<input class="w-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-secondary-container" dir="ltr" id="phone" name="phone" placeholder="٠٥XXXXXXXX" required="" style="text-align: right;" type="tel"/>
</div>
<!-- Governorate -->
<div class="flex flex-col relative group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-on-secondary-container transition-colors" for="governorate">المحافظة</label>
<select class="w-full font-body-md text-body-md text-on-surface focus:border-on-secondary-container appearance-none bg-transparent" id="governorate" name="governorate" required="">
<option selected="" value="إب">إب</option>
</select>
<span class="material-symbols-outlined absolute left-0 bottom-3 text-outline pointer-events-none">expand_more</span>
</div>
<!-- City -->
<div class="flex flex-col relative group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-on-secondary-container transition-colors" for="city">المدينة</label>
<input class="w-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-secondary-container" id="city" name="city" placeholder="أدخل اسم المدينة" required="" type="text"/>
</div>
<!-- Detailed Address -->
<div class="flex flex-col relative group md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-on-secondary-container transition-colors" for="address">تفاصيل العنوان</label>
<input class="w-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-secondary-container" id="address" name="address" placeholder="اسم الشارع، رقم المبنى، الحي" required="" type="text"/>
</div>
</div>
</section>
<!-- Payment Method Section -->
<section class="mb-12">
<h2 class="font-headline-md text-headline-md text-primary mb-8">طريقة الدفع</h2>
<div class="space-y-4">
<!-- Option 1: Bank Transfer -->
<label class="flex items-center p-6 border border-outline-variant hover:border-primary transition-colors cursor-pointer bg-surface-container-lowest">
<input checked="" class="radio-custom ml-4" name="paymentMethod" type="radio" value="bank_transfer"/>
<span class="flex-grow flex flex-col">
<span class="font-headline-sm text-[18px] text-primary">إيداع بنكي</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">تحويل مباشر إلى حسابنا البنكي.</span>
</span>
<span class="material-symbols-outlined text-outline text-[28px]">account_balance</span>
</label>
<!-- Option 2: Digital Wallet -->
<label class="flex items-center p-6 border border-outline-variant hover:border-primary transition-colors cursor-pointer bg-surface-container-lowest">
<input class="radio-custom ml-4" name="paymentMethod" type="radio" value="digital_wallet"/>
<span class="flex-grow flex flex-col">
<span class="font-headline-sm text-[18px] text-primary">محفظة إلكترونية</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">الدفع عبر الكريمي أو جوال.</span>
</span>
<span class="material-symbols-outlined text-outline text-[28px]">account_balance_wallet</span>
</label>
<!-- Option 3: Cash on Delivery -->
<label class="flex items-center p-6 border border-outline-variant hover:border-primary transition-colors cursor-pointer bg-surface-container-lowest">
<input class="radio-custom ml-4" name="paymentMethod" type="radio" value="cod"/>
<span class="flex-grow flex flex-col">
<span class="font-headline-sm text-[18px] text-primary">الدفع عند الاستلام</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">ادفع نقدًا عند استلام طلبك.</span>
</span>
<span class="material-symbols-outlined text-outline text-[28px]">payments</span>
</label>
</div>
</section>
<!-- Primary CTA -->
<button class="w-full md:w-auto bg-primary text-secondary-fixed font-label-caps text-label-caps px-12 py-5 hover:bg-primary-container transition-colors duration-300 flex items-center justify-center gap-3 group" type="submit">
                    تأكيد ومتابعة الدفع
                    <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
</button>
</form>
</div>
</main>
</body></html>
